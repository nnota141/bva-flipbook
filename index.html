<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Flipbook</title>
  <style>
:root {
  --bg: #0d0f12;
  --panel: rgba(23, 26, 31, .92);
  --panel-border: rgba(255,255,255,.08);
  --text: #f4f5f7;
  --muted: #9298a3;
  --accent: #fff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 40%, #20242a 0%, #0d0f12 58%);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, a { font: inherit; }

.topbar {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  right: 0;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-border);
  backdrop-filter: blur(18px);
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 180px; }
.brand-mark {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 9px;
  background: #fff;
  color: #111;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .5px;
}
.brand strong { display: block; font-size: 14px; }
.brand span { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
}

.toolbar button {
  width: 34px;
  height: 34px;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  background: rgba(255,255,255,.055);
  color: var(--text);
  cursor: pointer;
  transition: .18s ease;
}
.toolbar button:hover { background: rgba(255,255,255,.12); }
.toolbar button:disabled { opacity: .3; cursor: default; }

#pageInfo {
  min-width: 90px;
  text-align: center;
  color: #c7cad0;
  font-size: 12px;
}

.divider {
  width: 1px;
  height: 23px;
  background: var(--panel-border);
  margin: 0 7px;
}

.viewer {
  position: absolute;
  top: 68px;
  bottom: 48px;
  left: 0;
  right: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
}

.stage {
  position: relative;
  width: min(94vw, 1500px);
  height: min(88vh, 900px);
  display: grid;
  place-items: center;
  perspective: 2200px;
  overflow: visible;
}

.book-shadow {
  position: absolute;
  width: 72%;
  height: 76%;
  border-radius: 50%;
  background: rgba(0,0,0,.55);
  filter: blur(42px);
  transform: translateY(6%);
}

.book {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: stretch;
  justify-content: center;
  max-width: 96%;
  max-height: 94%;
  transform-origin: center center;
  transition: transform .2s ease;
}

.page {
  position: relative;
  background: #fff;
  overflow: hidden;
  box-shadow: 0 16px 50px rgba(0,0,0,.4);
  transform-style: preserve-3d;
}

.page canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.left-page {
  border-radius: 3px 0 0 3px;
  border-right: 1px solid rgba(0,0,0,.15);
}

.right-page {
  border-radius: 0 3px 3px 0;
  border-left: 1px solid rgba(0,0,0,.15);
}

.empty-state {
  width: min(520px, 85vw);
  padding: 55px 40px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 18px;
  background: rgba(25,28,34,.9);
  box-shadow: 0 30px 80px rgba(0,0,0,.35);
}
.empty-icon {
  display: inline-grid;
  place-items: center;
  width: 64px; height: 64px;
  border-radius: 15px;
  background: #fff;
  color: #111;
  font-weight: 900;
  font-size: 15px;
}
.empty-state h1 { margin: 20px 0 8px; font-size: 24px; }
.empty-state p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14px; }
code { color: #fff; }

.bottombar {
  position: fixed;
  z-index: 50;
  left: 0; right: 0; bottom: 0;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  color: var(--muted);
  background: var(--panel);
  border-top: 1px solid var(--panel-border);
  backdrop-filter: blur(18px);
  font-size: 11px;
}
.bottombar a { color: #d5d8dd; text-decoration: none; }
.bottombar a:hover { text-decoration: underline; }

.turn-next .right-page { animation: turnNext .55s ease both; }
.turn-prev .left-page { animation: turnPrev .55s ease both; }

@keyframes turnNext {
  0% { transform: rotateY(0); transform-origin: left center; }
  50% { transform: rotateY(-88deg); }
  100% { transform: rotateY(0); }
}
@keyframes turnPrev {
  0% { transform: rotateY(0); transform-origin: right center; }
  50% { transform: rotateY(88deg); }
  100% { transform: rotateY(0); }
}

@media (max-width: 800px) {
  .topbar { padding: 0 10px; }
  .brand { min-width: auto; }
  .brand > div:last-child { display: none; }
  .toolbar { gap: 3px; }
  .toolbar button { width: 32px; height: 32px; }
  #pageInfo { min-width: 72px; font-size: 11px; }
  .divider { margin: 0 3px; }
  .hint { display: none; }
  .bottombar { justify-content: center; }
  .book { max-width: 98%; }
}

@media (max-width: 520px) {
  .viewer { bottom: 40px; }
  .topbar { height: 60px; }
  .viewer { top: 60px; }
  .toolbar button:nth-of-type(5),
  .toolbar button:nth-of-type(6) { display: none; }
  .book { width: 96vw; }
}

  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">PDF</div>
      <div>
        <strong>Document Viewer</strong>
        <span>Flipbook</span>
      </div>
    </div>

    <div class="toolbar">
      <button id="prevBtn" title="Previous page">‹</button>
      <span id="pageInfo">Loading…</span>
      <button id="nextBtn" title="Next page">›</button>
      <span class="divider"></span>
      <button id="zoomOut" title="Zoom out">−</button>
      <button id="zoomReset" title="Reset zoom">100%</button>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="fullscreenBtn" title="Fullscreen">⛶</button>
    </div>
  </header>

  <main class="viewer">
    <div class="stage" id="stage">
      <div class="book-shadow"></div>
      <div class="book" id="book">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">PDF</div>
          <h1>PDF Flipbook</h1>
          <p>Place your PDF at <code>pdf/document.pdf</code> and reload this page.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="bottombar">
    <div class="hint">← → to navigate · Space to turn page · Pinch or scroll to zoom</div>
    <a href="https://github.com/" target="_blank" rel="noopener">GitHub Pages ready</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
  <script type="module">
const PDF_URL = "pdf/document.pdf";

const book = document.getElementById("book");
const stage = document.getElementById("stage");
const pageInfo = document.getElementById("pageInfo");
const emptyState = document.getElementById("emptyState");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const zoomIn = document.getElementById("zoomIn");
const zoomOut = document.getElementById("zoomOut");
const zoomReset = document.getElementById("zoomReset");
const fullscreenBtn = document.getElementById("fullscreenBtn");

let pdf = null;
let page = 1;
let scale = 1;
let animating = false;
let mobile = window.innerWidth <= 800;

const params = new URLSearchParams(location.search);
if (params.get("page")) page = Math.max(1, parseInt(params.get("page"), 10) || 1);

async function loadPdf() {
  try {
    const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    pdf = await pdfjsLib.getDocument(PDF_URL).promise;
    emptyState.remove();
    await renderBook();
  } catch (error) {
    console.error(error);
    pageInfo.textContent = "PDF not found";
  }
}

async function renderCanvas(pdfPage, canvas, targetWidth) {
  const base = pdfPage.getViewport({ scale: 1 });
  const viewport = pdfPage.getViewport({
    scale: (targetWidth / base.width) * window.devicePixelRatio
  });

  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);

  const ctx = canvas.getContext("2d", { alpha: false });
  await pdfPage.render({ canvasContext: ctx, viewport }).promise;
}

async function makePage(number, className, width) {
  if (number < 1 || number > pdf.numPages) return null;

  const pdfPage = await pdf.getPage(number);
  const base = pdfPage.getViewport({ scale: 1 });
  const aspect = base.height / base.width;

  const el = document.createElement("div");
  el.className = `page ${className}`;
  el.style.width = `${width}px`;
  el.style.height = `${width * aspect}px`;

  const canvas = document.createElement("canvas");
  el.appendChild(canvas);
  await renderCanvas(pdfPage, canvas, width);

  return el;
}

async function renderBook() {
  if (!pdf || animating) return;
  animating = true;

  book.classList.remove("turn-next", "turn-prev");
  book.innerHTML = "";

  mobile = window.innerWidth <= 800;

  const first = page;
  const second = mobile ? null : page + 1;

  const p1 = await pdf.getPage(first);
  const base = p1.getViewport({ scale: 1 });

  let pageWidth;
  if (mobile) {
    pageWidth = Math.min(window.innerWidth * 0.92, 700) * scale;
  } else {
    pageWidth = Math.min(window.innerWidth * 0.44, 690) * scale;
  }

  const left = await makePage(first, mobile ? "right-page" : "left-page", pageWidth);
  const right = second && second <= pdf.numPages
    ? await makePage(second, "right-page", pageWidth)
    : null;

  if (mobile) {
    if (left) book.appendChild(left);
  } else {
    if (left) book.appendChild(left);
    if (right) book.appendChild(right);
  }

  updateUI();
  fitBook();
  animating = false;
}

function fitBook() {
  const pages = [...book.querySelectorAll(".page")];
  if (!pages.length) return;

  const maxH = stage.clientHeight * 0.9;
  const maxW = mobile ? stage.clientWidth * 0.94 : stage.clientWidth * 0.88;

  let width = pages[0].offsetWidth;
  let height = pages[0].offsetHeight;

  const totalW = mobile ? width : width * 2;
  const ratio = Math.min(1, maxW / totalW, maxH / height);

  book.style.transform = `scale(${ratio})`;
}

function updateUI() {
  const end = mobile ? page : Math.min(page + 1, pdf.numPages);
  pageInfo.textContent = `${page}–${end} / ${pdf.numPages}`;
  prevBtn.disabled = page <= 1;
  nextBtn.disabled = page >= pdf.numPages;
  zoomReset.textContent = `${Math.round(scale * 100)}%`;

  const url = new URL(location.href);
  url.searchParams.set("page", page);
  history.replaceState(null, "", url);
}

async function nextPage() {
  if (!pdf || animating || page >= pdf.numPages) return;
  book.classList.add("turn-next");
  await new Promise(r => setTimeout(r, 220));
  page += mobile ? 1 : 2;
  await renderBook();
}

async function prevPage() {
  if (!pdf || animating || page <= 1) return;
  book.classList.add("turn-prev");
  await new Promise(r => setTimeout(r, 220));
  page -= mobile ? 1 : 2;
  if (page < 1) page = 1;
  await renderBook();
}

function changeZoom(delta) {
  scale = Math.max(.7, Math.min(1.8, scale + delta));
  renderBook();
}

prevBtn.addEventListener("click", prevPage);
nextBtn.addEventListener("click", nextPage);
zoomIn.addEventListener("click", () => changeZoom(.1));
zoomOut.addEventListener("click", () => changeZoom(-.1));
zoomReset.addEventListener("click", () => { scale = 1; renderBook(); });

fullscreenBtn.addEventListener("click", async () => {
  if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
});

document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    nextPage();
  }
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    prevPage();
  }
  if (e.key === "+" || e.key === "=") changeZoom(.1);
  if (e.key === "-") changeZoom(-.1);
  if (e.key.toLowerCase() === "f") fullscreenBtn.click();
});

let touchX = null;
stage.addEventListener("touchstart", e => {
  touchX = e.changedTouches[0].clientX;
}, { passive: true });

stage.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) dx < 0 ? nextPage() : prevPage();
}, { passive: true });

window.addEventListener("resize", () => {
  const wasMobile = mobile;
  mobile = window.innerWidth <= 800;
  if (wasMobile !== mobile) renderBook();
  else fitBook();
});

loadPdf();

  </script>
</body>
</html>
