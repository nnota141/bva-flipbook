<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BVA Document Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e8e6e0; --surface:#fbfaf7; --ink:#1d1f1c; --muted:#6b6e68; --line:#d9d6cd;
  --accent:#00785a; --accent-ink:#fff; --tint:#dcece4; --hover:#efede7; --shadow:rgba(30,28,20,.28);
  --h:56px; --bar:60px; --side:300px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--desk:#17181a; --surface:#202225; --ink:#ececea; --muted:#9a9d98; --line:#33363a;
    --accent:#4cc79b; --accent-ink:#06261b; --tint:#1f3a31; --hover:#2a2d30; --shadow:rgba(0,0,0,.6); color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--desk);color:var(--ink);
  font-family:"Google Sans","Google Sans Text","Product Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{position:fixed;inset:0 0 auto 0;height:var(--h);z-index:30;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.icon-btn:hover:not(:disabled){background:var(--hover)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.flag{width:5px;height:26px;border-radius:2px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.flag i{flex:1}.flag i:nth-child(1){background:#fff}.flag i:nth-child(2){background:#00966e}.flag i:nth-child(3){background:#d62612}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-weight:600;font-size:16px;white-space:nowrap}
.crumb{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb::before{content:"/";margin:0 8px 0 2px;opacity:.5}
.spacer{flex:1}

/* library panel */
nav{position:fixed;top:var(--h);bottom:var(--bar);left:0;width:var(--side);z-index:20;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 24px;
  transition:transform .25s ease}
body.closed nav{transform:translateX(-100%)}
nav h2{margin:18px 10px 6px;font-size:13px;font-weight:500;color:var(--muted)}
nav h2:first-child{margin-top:2px}
.doc{display:flex;align-items:baseline;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left}
.doc:hover{background:var(--hover)}
.doc.active{background:var(--tint)}
.doc .t{font-weight:600;min-width:52px}
.doc.active .t{color:var(--accent)}
.doc .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{margin:26px 10px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.9}
kbd{font:inherit;font-size:11.5px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--desk)}
.scrim{display:none}

/* viewer */
main{position:fixed;top:var(--h);bottom:var(--bar);right:0;left:var(--side);display:flex;overflow:auto;transition:left .25s ease}
body.closed main{left:0}
.stage{margin:auto;padding:28px}
.book{filter:drop-shadow(0 10px 22px var(--shadow));touch-action:pan-y}
.page{background:#fff;overflow:hidden}
.page canvas{display:block;width:100%;height:100%}
.page.blank{background:#f4f2ec}
.msg{max-width:420px;text-align:center;color:var(--muted)}
.msg h1{margin:0 0 6px;font-size:22px;font-weight:500;color:var(--ink)}
.msg p{margin:6px 0}
.msg code{color:var(--ink)}
.progress{position:fixed;top:var(--h);left:0;height:3px;width:0;background:var(--accent);z-index:40;transition:width .2s}
.edge{position:fixed;top:50%;z-index:15;width:46px;height:46px;margin-top:-23px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;opacity:.0;transition:opacity .2s}
main:hover~.edge,.edge:focus-visible{opacity:.92}
.edge:disabled{display:none}
.edge svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#edgePrev{left:calc(var(--side) + 14px)}#edgeNext{right:14px}
body.closed #edgePrev{left:14px}

/* control bar */
footer{position:fixed;inset:auto 0 0 0;height:var(--bar);z-index:30;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:var(--surface);border-top:1px solid var(--line)}
.pager{display:flex;align-items:center;gap:4px}
.where{display:flex;align-items:center;gap:6px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:128px;justify-content:center}
#pageInput{width:50px;height:32px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--desk)}
#pageInput:disabled{opacity:.4}
input[type=range]{flex:1;min-width:80px;height:20px;background:none;accent-color:var(--accent)}
.zoom{display:flex;align-items:center;gap:2px}
#zoomReset{min-width:54px;height:32px;border:0;border-radius:8px;background:none;font-variant-numeric:tabular-nums}
#zoomReset:hover{background:var(--hover)}

@media (max-width:860px){
  nav{width:min(86vw,320px);box-shadow:0 0 40px var(--shadow);top:0;bottom:0;padding-top:calc(var(--h) + 14px)}
  main,body.closed main{left:0}
  .scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.4)}
  body:not(.closed) .scrim{display:block}
  .keys{display:none}
  .edge{display:none}
  .stage{padding:14px}
}
@media (max-width:640px){
  :root{--bar:96px}
  header{padding:0 8px}
  .brand b{font-size:15px}
  footer{flex-wrap:wrap;align-content:center;gap:2px 6px;padding:0 10px}
  input[type=range]{order:-1;flex:1 0 100%}
  .zoom{margin-left:auto}
  .zoom .icon-btn{width:32px;height:32px}
  .keys{display:none}
}
</style>
</head>
<body class="closed">

<header>
  <button class="icon-btn" id="menuBtn" title="Library" aria-label="Toggle library">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand">
    <span class="flag"><i></i><i></i><i></i></span>
    <b>Bulgarian Virtual Airlines</b>
  </div>
  <span class="crumb" id="crumb">Document Library</span>
  <span class="spacer"></span>
  <button class="icon-btn" id="fullscreenBtn" title="Fullscreen (F)" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</header>

<div class="progress" id="progress"></div>
<div class="scrim" id="scrim"></div>

<nav id="library">
  <h2>Manuals</h2><div id="operationsList"></div>
  <h2>Airport briefings</h2><div id="airportsList"></div>
  <div class="keys">
    <kbd>←</kbd> <kbd>→</kbd> turn page &nbsp; <kbd>Home</kbd> <kbd>End</kbd> first / last<br>
    <kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd> zoom &nbsp; <kbd>F</kbd> fullscreen &nbsp; <kbd>G</kbd> go to page
  </div>
</nav>

<main id="viewer">
  <div class="stage" id="stage">
    <div class="book" id="book">
      <div class="msg"><h1>Document Library</h1><p>Open the menu and choose a manual or an airport briefing.</p></div>
    </div>
  </div>
</main>

<button class="edge" id="edgePrev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="edge" id="edgeNext" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

<footer>
  <div class="pager">
    <button class="icon-btn" id="prevBtn" title="Previous page" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="where"><input id="pageInput" inputmode="numeric" aria-label="Go to page" disabled><span id="total">of –</span></div>
    <button class="icon-btn" id="nextBtn" title="Next page" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <input type="range" id="scrub" min="1" max="1" value="1" disabled aria-label="Page scrubber">
  <div class="zoom">
    <button class="icon-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoomReset" title="Reset zoom">100%</button>
    <button class="icon-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</footer>

<script type="module">
/* ==========================================================
   DOCUMENTS — enabled: false hides an entry.
   PDFs live in /pdf. Manuals: "BVA OM-A.pdf". Airports: "LBSF Briefing.pdf".
   To add an airport, copy an entry below and drop "<ICAO> Briefing.pdf" into /pdf.
   ========================================================== */
const DOCUMENTS = {
  operations: [
    { id: "om-a", title: "OM-A", subtitle: "Operations Manual Part A", filename: "BVA OM-A.pdf", enabled: true },
    { id: "om-b", title: "OM-B", subtitle: "Operations Manual Part B", filename: "BVA OM-B.pdf", enabled: true }
  ],
  airports: [
    { id: "lbwn", icao: "LBWN", name: "Varna Airport",  enabled: true },
    { id: "lbbg", icao: "LBBG", name: "Burgas Airport", enabled: true },
    { id: "lbsf", icao: "LBSF", name: "Sofia Airport",  enabled: true }
    // ,{ id: "eddm", icao: "EDDM", name: "Munich Airport", enabled: true }
  ]
};

const PDF_BASE = "pdf/";
const $ = id => document.getElementById(id);
const book = $("book"), stage = $("stage"), viewer = $("viewer");
const pageInput = $("pageInput"), total = $("total"), scrub = $("scrub"), progress = $("progress");
const prevBtns = [$("prevBtn"), $("edgePrev")], nextBtns = [$("nextBtn"), $("edgeNext")];

let pdfjsLib, PageFlip, pageFlip = null, pdf = null, currentDoc = null;
let page = 1, scale = 1, loadToken = 0, busy = false, mobile = false;
let pageMap = [], slots = [];   // pageMap[index] = pdf page number or null (blank)

const docs = () => [
  ...DOCUMENTS.operations.filter(d => d.enabled).map(d => ({ ...d, type: "operations" })),
  ...DOCUMENTS.airports.filter(d => d.enabled).map(d => ({
    ...d, type: "airport", title: d.icao, subtitle: d.name || "Airport briefing", filename: `${d.icao} Briefing.pdf`
  }))
];

async function initialize() {
  buildNavigation();
  try {
    pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
    PageFlip = (await import("https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.module.js")).PageFlip;
  } catch (e) {
    console.error(e);
    return message("Viewer could not start", "The PDF engine failed to load. Check your connection and reload.");
  }
  const params = new URLSearchParams(location.search);
  const list = docs();
  const start = list.find(d => d.id === params.get("doc")) || list[0];
  if (!start) return message("Nothing to show", "No documents are enabled.");
  const p = parseInt(params.get("page"), 10);
  page = Number.isFinite(p) ? Math.max(1, p) : 1;
  if (matchMedia("(min-width:861px)").matches) document.body.classList.remove("closed");
  selectDocument(start, page);
}

function buildNavigation() {
  const fill = (el, items) => items.forEach(d => {
    const b = document.createElement("button");
    b.className = "doc"; b.dataset.id = d.id;
    b.innerHTML = `<span class="t"></span><span class="s"></span>`;
    b.firstChild.textContent = d.title; b.lastChild.textContent = d.subtitle;
    b.onclick = () => { selectDocument(d, 1); if (!matchMedia("(min-width:861px)").matches) document.body.classList.add("closed"); };
    el.appendChild(b);
  });
  const all = docs();
  fill($("operationsList"), all.filter(d => d.type === "operations"));
  fill($("airportsList"), all.filter(d => d.type === "airport"));
}

function message(title, text, code) {
  book.innerHTML = "";
  const m = document.createElement("div");
  m.className = "msg";
  m.innerHTML = `<h1></h1><p></p>${code ? "<p><code></code></p>" : ""}`;
  m.querySelector("h1").textContent = title;
  m.querySelector("p").textContent = text;
  if (code) m.querySelector("code").textContent = code;
  book.appendChild(m);
}

function setControls(on) {
  pageInput.disabled = scrub.disabled = !on;
  if (!on) { pageInput.value = ""; total.textContent = "of –"; prevBtns.concat(nextBtns).forEach(b => b.disabled = true); }
}

async function selectDocument(doc, startPage = 1) {
  const token = ++loadToken;
  if (pageFlip) { pageFlip.destroy(); pageFlip = null; }
  currentDoc = doc; pdf = null; page = startPage; scale = 1;
  document.querySelectorAll(".doc").forEach(b => b.classList.toggle("active", b.dataset.id === doc.id));
  $("crumb").textContent = `${doc.title} · ${doc.subtitle}`;
  document.title = `${doc.title} — BVA Document Library`;
  setControls(false);
  message(`Opening ${doc.title}…`, "One moment.");
  progress.style.width = "6%";
  try {
    const task = pdfjsLib.getDocument(PDF_BASE + encodeURIComponent(doc.filename));
    task.onProgress = ({ loaded, total: t }) => { if (t && token === loadToken) progress.style.width = Math.max(6, loaded / t * 80) + "%"; };
    const loaded = await task.promise;
    if (token !== loadToken) return;
    pdf = loaded;
    await renderBook();
  } catch (e) {
    if (token !== loadToken) return;
    console.error(e);
    pdf = null;
    message("Document unavailable", "Could not load the file. Check that it is in the pdf folder and the name matches exactly:", doc.filename);
  }
  if (token === loadToken) { progress.style.width = "100%"; setTimeout(() => token === loadToken && (progress.style.width = "0"), 300); }
}

/* Pages are created empty and drawn on demand around the reader's position. */
async function drawSlot(i) {
  const s = slots[i];
  if (!s || s.done || s.busy || !s.n) return;
  s.busy = true;
  const token = loadToken, doc = pdf;
  try {
    const p = await doc.getPage(s.n);
    const base = p.getViewport({ scale: 1 });
    const v = p.getViewport({ scale: s.w / base.width * Math.min(devicePixelRatio || 1, 2) });
    s.canvas.width = Math.ceil(v.width); s.canvas.height = Math.ceil(v.height);
    await p.render({ canvasContext: s.canvas.getContext("2d", { alpha: false }), viewport: v }).promise;
    if (token === loadToken) s.done = true;
  } catch (e) { console.error("render", s.n, e); }
  s.busy = false;
}
async function drawAround(index) {
  const order = [];
  for (let d = 0; d <= 5; d++) { order.push(index + d); if (d) order.push(index - d); }
  for (const i of order) await drawSlot(i);
}

async function renderBook() {
  if (!pdf) return;
  busy = true;
  const token = loadToken, N = pdf.numPages;
  if (pageFlip) { pageFlip.destroy(); pageFlip = null; }
  book.innerHTML = "";
  mobile = innerWidth <= 640;
  page = Math.min(Math.max(1, page), N);

  const first = await pdf.getPage(1);
  if (token !== loadToken) return;
  const base = first.getViewport({ scale: 1 }), ratio = base.height / base.width;
  const availW = viewer.clientWidth - (innerWidth <= 860 ? 28 : 56);
  const availH = viewer.clientHeight - (innerWidth <= 860 ? 28 : 56);
  const fitW = Math.min(mobile ? availW : availW / 2, availH / ratio, 760);
  const w = Math.max(140, Math.round(fitW * scale)), h = Math.round(w * ratio);

  const blankBefore = !mobile && N > 1 && N % 2 === 1;   // keeps the back cover on its own sheet
  pageMap = []; slots = [];
  const els = [];
  for (let n = 1; n <= N; n++) {
    if (blankBefore && n === N) { pageMap.push(null); slots.push({}); const b = document.createElement("div"); b.className = "page blank"; b.dataset.density = "soft"; els.push(b); }
    const el = document.createElement("div");
    el.className = "page"; el.dataset.density = "soft";
    el.style.cssText = `width:${w}px;height:${h}px`;
    const canvas = document.createElement("canvas");
    el.appendChild(canvas);
    pageMap.push(n); slots.push({ n, w, canvas, done: false, busy: false }); els.push(el);
  }
  els.forEach(e => { if (!e.style.width) e.style.cssText = `width:${w}px;height:${h}px`; });

  const startIndex = Math.max(0, pageMap.indexOf(page));
  pageFlip = new PageFlip(book, {
    width: w, height: h, size: "fixed", minWidth: 120, maxWidth: 1400, minHeight: 160, maxHeight: 1800,
    showCover: !mobile, usePortrait: mobile, startPage: startIndex,
    drawShadow: true, maxShadowOpacity: .35, flippingTime: 600,
    autoSize: false, mobileScrollSupport: false, clickEventForward: true
  });
  pageFlip.loadFromHTML(els);
  pageFlip.on("flip", e => { onIndex(Number(e.data)); });
  scrub.max = N; total.textContent = `of ${N}`;
  setControls(true);
  onIndex(startIndex);
  busy = false;
}

function onIndex(index) {
  const real = pageMap[index] ?? pageMap[index - 1] ?? 1;
  page = real;
  const N = pdf.numPages;
  const end = (mobile || index === 0) ? real : Math.min(real + 1, N);
  pageInput.value = real === end ? real : `${real}–${end}`;
  scrub.value = real;
  prevBtns.forEach(b => b.disabled = real <= 1);
  nextBtns.forEach(b => b.disabled = end >= N);
  $("zoomReset").textContent = Math.round(scale * 100) + "%";
  const u = new URL(location.href);
  u.searchParams.set("doc", currentDoc.id); u.searchParams.set("page", real);
  history.replaceState(null, "", u);
  drawAround(index);
}

/* navigation */
const nextPage = () => pageFlip && !busy && pageFlip.flipNext();
const prevPage = () => pageFlip && !busy && pageFlip.flipPrev();
function goTo(n) {
  if (!pageFlip || !pdf || isNaN(n)) return;
  n = Math.min(Math.max(1, Math.round(n)), pdf.numPages);
  const i = pageMap.indexOf(n);
  if (i >= 0) pageFlip.flip(i);
}
function zoomBy(d) {
  if (!pdf || busy) return;
  scale = Math.max(.7, Math.min(2, +(scale + d).toFixed(2)));
  renderBook();
}

prevBtns.forEach(b => b.onclick = prevPage);
nextBtns.forEach(b => b.onclick = nextPage);
$("zoomIn").onclick = () => zoomBy(.1);
$("zoomOut").onclick = () => zoomBy(-.1);
$("zoomReset").onclick = () => { if (pdf && !busy) { scale = 1; renderBook(); } };
scrub.oninput = () => { pageInput.value = scrub.value; };
scrub.onchange = () => goTo(+scrub.value);
pageInput.onfocus = () => pageInput.select();
pageInput.onkeydown = e => { if (e.key === "Enter") { goTo(parseInt(pageInput.value, 10)); pageInput.blur(); } e.stopPropagation(); };
pageInput.onblur = () => { if (pdf) onIndex(Math.max(0, pageMap.indexOf(page))); };
$("menuBtn").onclick = () => document.body.classList.toggle("closed");
$("scrim").onclick = () => document.body.classList.add("closed");
$("fullscreenBtn").onclick = async () => {
  try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); }
  catch (e) { console.error(e); }
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowRight" || k === " ") { e.preventDefault(); nextPage(); }
  else if (k === "ArrowLeft") { e.preventDefault(); prevPage(); }
  else if (k === "Home") { e.preventDefault(); goTo(1); }
  else if (k === "End") { e.preventDefault(); goTo(pdf?.numPages); }
  else if (k === "+" || k === "=") zoomBy(.1);
  else if (k === "-") zoomBy(-.1);
  else if (k === "0") { scale = 1; pdf && renderBook(); }
  else if (k.toLowerCase() === "f") $("fullscreenBtn").click();
  else if (k.toLowerCase() === "g") { e.preventDefault(); pageInput.focus(); }
});

let resizeTimer;
addEventListener("resize", () => {
  if (!pdf) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderBook, 200);
});

initialize();
</script>
</body>
</html>
